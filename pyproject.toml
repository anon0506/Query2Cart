[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "query2cart"
version = "0.1.0"
description = "A benchmark for evaluating conversational recommendation agents"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "litellm>=1.0",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
generation = [
    "openai>=1.0",
]
